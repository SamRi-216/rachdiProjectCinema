{% extends "base.html" %}

{% block titre %}Accueil - Cinéma du Castor{% endblock %}

{% block contenu %}

<div id="main" class="container-fluid">

<h1>{{ film.titre }}</h1>
<h6>&nbsp;</h6>
<h6>&nbsp;</h6>
    <div class="row">

        <div class="col-sm-6 col-lg-9 bordure">
            <h2>Information</h2>
            <ul>
            <li>Durée : {{ film['duree'] }} min </li>

            <div class="col-sm-6 col-lg-2 bordure">
                <img src="{{ url_for('static', filename='image/' ~ (film['interdit_-16_ans'] | default('default.png'))) }}" class="img-fluid"/>
            </div>

            <h2>Résumé</h2>
            <p>{{ film.resume }}</p>
        </ul>
        </div>

        <div class="col-sm-6 col-lg-2 bordure">
            <img src="{{ url_for('static', filename='image/' ~ (film['affiche'] | default('default.png'))) }}" class="img-fluid" alt="Affiche du film"/>
        </div>

    </div>

    <div class="col-sm-6">
        <a href="index.html"> Revenir à l'acceuil</a>
    </div>

{% endblock %}

<footer class="pied mt-auto">
    BTS CIEL Simone de Beauvoir, 2026
</footer>
